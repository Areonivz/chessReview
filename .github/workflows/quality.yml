name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Python
        run: ruff check .
      - name: Check Python formatting
        run: ruff format --check .
      - name: Run backend tests
        run: python -m pytest tests -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Build frontend
        run: npm run build

  container:
    name: Backend container and Stockfish smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build backend container
        run: docker build --tag chess-review-api --file backend/Dockerfile .
      - name: Smoke test container
        run: |
          set -euo pipefail
          docker run --detach --name chess-review-api -p 10000:10000 chess-review-api
          trap 'docker logs chess-review-api; docker rm --force chess-review-api >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:10000/health; then
              break
            fi
            sleep 2
          done
          curl --fail http://localhost:10000/health
          curl --fail --request POST http://localhost:10000/engine/smoke
